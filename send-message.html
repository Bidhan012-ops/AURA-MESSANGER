<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Aura Messenger - Public Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#0b513d",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "tertiary-fixed-dim": "#95d3ba",
                        "on-secondary-fixed": "#0d1c2f",
                        "tertiary-fixed": "#b0f0d6",
                        "on-tertiary-container": "#004231",
                        "on-secondary": "#233144",
                        "on-tertiary": "#003829",
                        "secondary-fixed-dim": "#b9c7e0",
                        "on-primary": "#003824",
                        "inverse-primary": "#006c49",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "secondary-container": "#3c4a5e",
                        "on-primary-fixed": "#002113",
                        "surface-container-low": "#191c1e",
                        "surface-container": "#1d2022",
                        "secondary-fixed": "#d5e3fd",
                        "surface-dim": "#101415",
                        "surface-bright": "#363a3b",
                        "on-secondary-fixed-variant": "#3a485c",
                        "inverse-surface": "#e0e3e5",
                        "on-primary-fixed-variant": "#005236",
                        "primary-container": "#10b981",
                        "on-surface": "#e0e3e5",
                        "tertiary-container": "#71af97",
                        "surface": "#101415",
                        "on-surface-variant": "#bbcabf",
                        "surface-variant": "#323537",
                        "surface-tint": "#4edea3",
                        "surface-container-high": "#272a2c",
                        "on-primary-container": "#00422b",
                        "background": "#101415",
                        "tertiary": "#95d3ba",
                        "on-secondary-container": "#abb9d2",
                        "primary-fixed": "#6ffbbe",
                        "outline-variant": "#3c4a42",
                        "outline": "#86948a",
                        "primary": "#4edea3",
                        "on-background": "#e0e3e5",
                        "primary-fixed-dim": "#4edea3",
                        "surface-container-lowest": "#0b0f10",
                        "inverse-on-surface": "#2d3133",
                        "on-tertiary-fixed": "#002117",
                        "surface-container-highest": "#323537",
                        "secondary": "#b9c7e0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "24px",
                        "container-padding-mobile": "20px",
                        "container-padding-desktop": "40px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-xl-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #050505;
            background-image: 
                linear-gradient(rgba(78, 222, 163, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(78, 222, 163, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            background-attachment: fixed;
        }
        
        .glass-panel {
            background: rgba(16, 20, 21, 0.6);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .glass-input {
            background: rgba(11, 15, 16, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 2px solid #4edea3;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            border-left-color: #4edea3;
            outline: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 0 15px rgba(78, 222, 163, 0.1);
        }

        .glow-btn {
            transition: all 0.3s ease;
        }
        
        .glow-btn:hover {
            box-shadow: 0 0 20px rgba(78, 222, 163, 0.4);
        }
        
        .bg-wash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(78, 222, 163, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(13, 28, 47, 0.4) 0%, transparent 50%);
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary/30 selection:text-primary">
<div class="bg-wash"></div>
<!-- Header (Brand Anchor) -->
<header class="w-full flex justify-center items-center h-20 glass-panel border-b-0 border-x-0 border-t-0 fixed top-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<span class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Aura Messenger</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding-mobile md:px-container-padding-desktop pt-32 pb-24 relative z-10">
<div class="text-center mb-10 w-full max-w-2xl">
<h1 class="font-headline-xl text-headline-xl-mobile md:text-headline-xl font-bold text-on-surface mb-stack-sm tracking-tight drop-shadow-lg">Public Profile</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Share your thoughts with the world, securely and anonymously.</p>
</div>
<div class="w-full max-w-2xl space-y-stack-lg">
<!-- Message Input Card -->
<div class="glass-panel rounded-xl p-6 md:p-8 relative overflow-hidden group">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none group-hover:bg-primary/10 transition-colors duration-700"></div>
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<label class="sr-only" for="anonymous_message">Write a message</label>
<textarea class="glass-input w-full rounded-lg p-4 font-body-md text-on-surface placeholder:text-on-surface-variant/50 resize-none" id="anonymous_message" name="anonymous_message" placeholder="Write a message..." required="" rows="4"></textarea>
<div class="flex justify-between items-center mt-2">
<div class="flex items-center gap-2 text-on-surface-variant/60 font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="">End-to-end encrypted</span>
</div>
<button class="glow-btn bg-primary text-surface-container-lowest font-label-md text-label-md px-8 py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors" type="submit">
<span class="">Send</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</form>
</div>
<!-- AI Suggestions Section -->
<div class="glass-panel rounded-xl p-6 md:p-8">
<div class="flex items-center justify-between mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                        AI Suggestions
                    </h2>
<span class="font-label-sm text-label-sm px-3 py-1 rounded-full bg-primary/10 text-primary border border-primary/20">Refresh</span>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-sm">
<button class="text-left w-full glass-panel border border-white/5 hover:border-primary/50 hover:bg-primary/5 rounded-lg p-4 font-body-md text-on-surface-variant hover:text-on-surface transition-all duration-300 flex items-start gap-3 group" onclick="document.getElementById('anonymous_message').value = this.innerText; document.getElementById('anonymous_message').focus();" type="button">
<span class="material-symbols-outlined text-primary/50 group-hover:text-primary mt-0.5 text-[20px]">chat_bubble</span>
<span class="">Drop a hot take about me.</span>
</button>
<button class="text-left w-full glass-panel border border-white/5 hover:border-primary/50 hover:bg-primary/5 rounded-lg p-4 font-body-md text-on-surface-variant hover:text-on-surface transition-all duration-300 flex items-start gap-3 group" onclick="document.getElementById('anonymous_message').value = this.innerText; document.getElementById('anonymous_message').focus();" type="button">
<span class="material-symbols-outlined text-primary/50 group-hover:text-primary mt-0.5 text-[20px]">psychology_alt</span>
<span class="">What's one thing you'd never say to my face?</span>
</button>
<button class="text-left w-full glass-panel border border-white/5 hover:border-primary/50 hover:bg-primary/5 rounded-lg p-4 font-body-md text-on-surface-variant hover:text-on-surface transition-all duration-300 flex items-start gap-3 group" onclick="document.getElementById('anonymous_message').value = this.innerText; document.getElementById('anonymous_message').focus();" type="button">
<span class="material-symbols-outlined text-primary/50 group-hover:text-primary mt-0.5 text-[20px]">favorite</span>
<span class="">Who do you think I have a crush on?</span>
</button>
<button class="text-left w-full glass-panel border border-white/5 hover:border-primary/50 hover:bg-primary/5 rounded-lg p-4 font-body-md text-on-surface-variant hover:text-on-surface transition-all duration-300 flex items-start gap-3 group" onclick="document.getElementById('anonymous_message').value = this.innerText; document.getElementById('anonymous_message').focus();" type="button">
<span class="material-symbols-outlined text-primary/50 group-hover:text-primary mt-0.5 text-[20px]">handshake</span>
<span class="">Am I actually a good friend?</span>
</button>
<button class="text-left w-full glass-panel border border-white/5 hover:border-primary/50 hover:bg-primary/5 rounded-lg p-4 font-body-md text-on-surface-variant hover:text-on-surface transition-all duration-300 flex items-start gap-3 group md:col-span-2" onclick="document.getElementById('anonymous_message').value = this.innerText; document.getElementById('anonymous_message').focus();" type="button">
<span class="material-symbols-outlined text-primary/50 group-hover:text-primary mt-0.5 text-[20px]">lightbulb</span>
<span class="">Tell me something I don't know about you.</span>
</button>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-6 text-center text-on-surface-variant/40 font-label-sm text-label-sm">
<p class="">© 2024 Aura Messenger. Secure, Anonymous Feedback.</p>
</footer>


</body></html>
